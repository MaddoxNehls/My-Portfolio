<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maddox Nehls · Software Engineer</title><meta name="description" content="Maddox Nehls, a software engineer in Beaverton, Oregon. Projects, career, and resume."><meta property="og:title" content="Maddox Nehls · Software Engineer"><meta property="og:description" content="Projects, career, and resume."><meta property="og:image" content="/img/me.webp"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%2318181b%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Arial%22 font-size=%2216%22 font-weight=%22700%22 fill=%22%23fafafa%22 text-anchor=%22middle%22%3EM%3C/text%3E%3C/svg%3E"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<style>
/* Instruments v2. A row of panels sized to what they hold. Details open as a sheet that rises inside its panel
   while the panel behind it steps back. Tokens follow a zinc scale; cards get a hairline ring and a soft bottom bevel. */
:root{
  --bg:#09090b;--fg:#18181b;--lift:#27272a;--lift-h:#323236;--sunk:#000;--line:#27272a;--line-2:#3f3f46;--dot:#3f3f46;
  --t1:#fafafa;--t2:#d4d4d8;--t3:#71717a;--lab:#a1a1aa;--acc:#84cc16;--acc-d:#65a30d;
  --hatch:#ffffff1f;--glass:#27272ab8;--lab-sh:#09090b;--blue:#60a5fa;--on-blue:#09090b;--on-acc:#0a0a0a;
  --sh-card:0 0 0 .75px #0006,0 -2px .5px 0 #ffffff0d inset,0 -3.5px .5px 0 #0003 inset;
  --sh-lift:0 10px 30px #0008,0 2px 6px #0006;
  --sans:"Chivo","Helvetica Neue",Arial,sans-serif;--mono:"Chivo Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--sheet:cubic-bezier(.32,.72,0,1);
  --gut:max(24px,env(safe-area-inset-left,0px));--gut-r:max(24px,env(safe-area-inset-right,0px));
  color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e4e4e7;--fg:#fafafa;--lift:#fff;--lift-h:#f4f4f5;--sunk:#27272a;--line:#d4d4d8;--line-2:#a1a1aa;--dot:#d4d4d8;
  --t1:#27272a;--t2:#52525b;--t3:#71717a;--lab:#78716c;--acc:#65a30d;--acc-d:#4d7c0f;
  --hatch:#0000001a;--glass:#ffffffb8;--lab-sh:#ffffff80;--blue:#2563eb;--on-blue:#fff;
  --sh-card:0 0 0 .75px #00000029,0 -2px .5px 0 #fff6 inset,0 -3.5px .5px 0 #0000000a inset;
  --sh-lift:0 10px 30px #0000001f,0 2px 6px #00000014;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e4e4e7;--fg:#fafafa;--lift:#fff;--lift-h:#f4f4f5;--sunk:#27272a;--line:#d4d4d8;--line-2:#a1a1aa;--dot:#d4d4d8;
  --t1:#27272a;--t2:#52525b;--t3:#71717a;--lab:#78716c;--acc:#65a30d;--acc-d:#4d7c0f;
  --hatch:#0000001a;--glass:#ffffffb8;--lab-sh:#ffffff80;--blue:#2563eb;--on-blue:#fff;
  --sh-card:0 0 0 .75px #00000029,0 -2px .5px 0 #fff6 inset,0 -3.5px .5px 0 #0000000a inset;
  --sh-lift:0 10px 30px #0000001f,0 2px 6px #00000014;color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--acc-d);outline-offset:2px}
.ph{color:var(--t3);text-decoration:underline dotted var(--line-2);text-underline-offset:4px}
svg.i{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:20px;height:64px;padding-left:var(--gut);padding-right:var(--gut-r)}
.who{display:flex;align-items:center;gap:14px;white-space:nowrap;min-width:0}
.who b{font-weight:500;color:var(--t2);letter-spacing:-.01em}
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.status i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.map{position:relative;flex:1;max-width:640px;margin-inline:auto;display:flex;gap:2px;height:30px;padding:3px;border-radius:10px;corner-shape:squircle;background:color-mix(in oklab,var(--fg) 85%,transparent);box-shadow:var(--sh-card);touch-action:none;cursor:pointer;user-select:none}
.seg{position:relative;z-index:1;flex:var(--g,1) 1 0;min-width:0;container-type:inline-size;display:flex;align-items:center;justify-content:center;border-radius:7px;color:var(--t3);transition:color .15s var(--ease)}
.seg span{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
@container (max-width:46px){.seg span{display:none}}
.seg:hover{color:var(--t2)}
.seg.in{color:var(--t1)}
.seg.ping::after{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.lens{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:7px;corner-shape:squircle;background:var(--lift);box-shadow:var(--sh-card);pointer-events:none}
.tools{display:flex;align-items:center;gap:8px}
.sb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;corner-shape:squircle;background:var(--lift);box-shadow:var(--sh-card);font-size:12.5px;font-weight:500;color:var(--t1);white-space:nowrap;transition:background .15s var(--ease),transform .15s var(--ease),opacity .15s}
.sb:hover{background:var(--lift-h);transform:translateY(-1px)}
.sb:active{transform:none}
.sb[disabled]{opacity:.35;cursor:default;transform:none;background:var(--lift)}
.sb.sq{width:28px;padding:0}
.sb.ar{width:44px;padding:0}

/* row of panels */
.row{position:relative;flex:1;min-height:0;display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;padding-left:var(--gut);padding-right:var(--gut-r);padding-block:0 24px;scroll-padding-inline:var(--gut) var(--gut-r);scrollbar-width:none;overscroll-behavior-x:contain}
.row::-webkit-scrollbar{display:none}
.p{--pw:var(--w);flex:0 0 var(--pw);position:relative;height:100%;border-radius:28px;corner-shape:squircle;overflow:hidden;background:var(--sunk);box-shadow:var(--sh-card);scroll-snap-align:start;transition:flex-basis .5s var(--sheet);animation:rise .8s var(--sheet) both;animation-delay:calc(var(--i) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@media (min-width:1100px){.p.wide{--pw:var(--w-open)}}
.wrap{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--fg);border-radius:inherit;corner-shape:squircle;scrollbar-width:none;transform-origin:50% 0;transition:transform .5s var(--sheet),filter .5s var(--sheet)}
.wrap::-webkit-scrollbar{display:none}
.p.open .wrap{transform:scale(.93) translateY(12px);filter:brightness(.55)}
.hd{position:sticky;top:0;z-index:3;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px}
.hd::before{content:"";position:absolute;inset:0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-mask-image:linear-gradient(#000 10%,transparent);mask-image:linear-gradient(#000 10%,transparent)}
.hd::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--fg),color-mix(in oklab,var(--fg) 60%,transparent) 55%,transparent)}
.hd>*{position:relative;z-index:1}
.lbl{font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--lab);text-shadow:0 1px 1px var(--lab-sh)}
.meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--lift);box-shadow:var(--sh-card);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--t1)}
.chip:hover{background:var(--lift-h)}
.bd{padding:4px 22px 28px}

/* shared bits */
.card{background:var(--lift);box-shadow:var(--sh-card);border-radius:16px;corner-shape:squircle}
.tap{transition:background .15s var(--ease),opacity .35s var(--ease),filter .35s var(--ease)}
.tap:hover{background:var(--lift-h)}
.k{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--lab)}
.k::after{content:"";flex:1;border-top:1px dotted var(--dot)}
.frs{display:grid;gap:9px}
.fr{display:flex;align-items:center;gap:12px;min-width:0}
.fr>span:first-child{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.fr>i{flex:1;min-width:16px;border-top:1px dotted var(--dot)}
.fr>span:last-child{font-size:14px;color:var(--t2);text-align:right;min-width:0}
.fr a{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.fr a:hover{color:var(--t1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border-radius:10px;corner-shape:squircle;background:var(--lift);box-shadow:var(--sh-card);font-size:14px;font-weight:500;color:var(--t1);transition:background .15s var(--ease),transform .15s var(--ease)}
.btn:hover{background:var(--lift-h);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.ic{width:40px;padding:0}
.btn svg{width:16px;height:16px}
.lg{display:inline-flex;color:var(--t2)}
.lg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ul li{position:relative;padding-left:16px;color:var(--t1);line-height:1.5}
.ul li::before{content:"";position:absolute;left:2px;top:.66em;width:4px;height:4px;border-radius:50%;background:var(--t3)}

/* about */
.photo{aspect-ratio:1;border-radius:14px;corner-shape:squircle;overflow:hidden;background:var(--lift);box-shadow:var(--sh-card)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.hello{font-size:20px;line-height:1.5;font-weight:500;color:var(--t1);margin:24px 0 12px;text-wrap:pretty}
.sub{color:var(--t2);margin:0 0 20px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.facts{display:grid;gap:22px}
.fact .k{margin-bottom:7px}
.fact p{color:var(--t1);line-height:1.45}

/* projects */
.pj{display:block;width:100%;padding:8px;margin-bottom:12px}
.pj.dim{opacity:.28;filter:saturate(0)}
.media{position:relative;container-type:inline-size;aspect-ratio:16/9;border-radius:10px;corner-shape:squircle;overflow:hidden;background:var(--bg);box-shadow:0 0 0 .5px var(--line)}
.media>img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:opacity .2s var(--ease),transform .8s var(--sheet)}
.pj:hover .media>img{transform:scale(1.015)}
.th{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.th span{aspect-ratio:16/10;border-radius:6px;corner-shape:squircle;overflow:hidden;box-shadow:0 0 0 .5px var(--line);opacity:.6;transition:opacity .15s var(--ease)}
.th span{position:relative}
.th span.on,.th span:hover{opacity:1}
.th span.on::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--acc);transform-origin:left;animation:reel var(--reel,3.2s) linear both}
.pj.hold .th span.on::after,.pj:not(.play) .th span.on::after{animation-play-state:paused}
@keyframes reel{from{transform:scaleX(0)}}
.th img{width:100%;height:100%;object-fit:cover;object-position:top center}
.cap{display:flex;align-items:center;gap:9px;padding:11px 4px 3px}
.cap b{font-weight:500;font-size:15px}
.cap em{margin-left:auto;font-style:normal;font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* data visuals for projects without screens */
.viz{position:absolute;inset:0;padding:clamp(16px,4.2cqw,40px) clamp(18px,4.6cqw,44px);display:flex;flex-direction:column;justify-content:space-between;gap:10px;background:var(--bg)}
.vt{font-family:var(--mono);font-size:clamp(10px,1.9cqw,13px);letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.vbig{font-size:clamp(36px,9.5cqw,84px);font-weight:500;letter-spacing:-.03em;line-height:1;color:var(--t1)}
.vbig small{font-size:clamp(13px,2.4cqw,18px);letter-spacing:0;font-weight:400;color:var(--t3);margin-left:8px}
.bars{display:grid;gap:clamp(7px,1.6cqw,14px)}
.bars div{display:grid;grid-template-columns:clamp(96px,22cqw,170px) minmax(0,1fr) clamp(34px,6cqw,48px);align-items:center;gap:clamp(10px,2cqw,16px);font-size:clamp(12px,2.2cqw,15px);color:var(--t2)}
.bars u{display:block;height:clamp(8px,1.7cqw,13px);border-radius:99px;width:var(--v);background:var(--line-2);transform-origin:left;transition:transform 1.1s var(--sheet)}
.pj:not(.seen) .bars u{transform:scaleX(0)}
.bars div:nth-child(2) u{transition-delay:.08s}.bars div:nth-child(3) u{transition-delay:.16s}.bars div:nth-child(4) u{transition-delay:.24s}
.bars .me u{background:var(--acc-d)}
.bars .ref u{background:repeating-linear-gradient(315deg,var(--hatch) 0 1px,transparent 0 50%) 0 0/6px 6px;box-shadow:0 0 0 .75px var(--line-2) inset}
.bars em{font-style:normal;font-family:var(--mono);font-size:clamp(11px,2cqw,14px);color:var(--t3);text-align:right}
.claim{font-size:clamp(16px,4.4cqw,34px);letter-spacing:-.01em;line-height:1.4;color:var(--t1);text-wrap:balance}
.claim code{font-family:var(--mono);font-size:.85em;color:var(--t2)}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:clamp(10.5px,1.9cqw,13px);letter-spacing:.04em;text-transform:uppercase;color:var(--t2);padding:clamp(5px,1cqw,8px) clamp(8px,1.6cqw,12px);border-radius:7px;background:var(--lift);box-shadow:var(--sh-card)}
.steps li.ok{color:var(--acc)}
.steps i{font-style:normal;color:var(--t3)}
.steps li.ok i{color:var(--acc-d)}

/* sheet: rises from the bottom of its panel */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;max-height:calc(100% - 22px);touch-action:pan-y;display:flex;flex-direction:column;background:var(--fg);border-radius:24px 24px 0 0;corner-shape:squircle;box-shadow:var(--sh-card),0 -10px 30px #0000004d;transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .5s var(--sheet),visibility 0s .5s}
.p.open .sheet{transform:none;visibility:visible;transition:transform .5s var(--sheet),visibility 0s}
.sheet:focus{outline:none}
.grab{position:absolute;top:0;left:0;right:0;z-index:2;height:56px;border-radius:24px 24px 0 0;cursor:grab;touch-action:none}
.grab::before{content:"";position:absolute;inset:0;border-radius:inherit;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-mask-image:linear-gradient(#000 10%,transparent);mask-image:linear-gradient(#000 10%,transparent)}
.grab::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(var(--fg),color-mix(in oklab,var(--fg) 60%,transparent) 55%,transparent)}
.grab i{position:absolute;z-index:1;left:50%;top:22px;width:44px;height:4px;margin-left:-22px;border-radius:2px;background:var(--line-2);transition:background .15s}
.grab:hover i{background:var(--t3)}
.sc{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:64px 24px 104px}
.sc::-webkit-scrollbar{display:none}
.sh h3{font-size:24px;font-weight:500;letter-spacing:-.015em;line-height:1.2;margin-bottom:10px;text-wrap:balance}
.sh .over{margin-bottom:10px}
.lead{color:var(--t2);font-size:15.5px;line-height:1.65;margin-bottom:24px;max-width:62ch}
.sh .frs{margin-bottom:34px}
.sh h4{font-size:18px;font-weight:500;margin-bottom:14px}
.fig{margin:0 0 22px}
.fig .media{aspect-ratio:16/10}
.fig .media:has(>img,>video){aspect-ratio:auto}.fig .media>img,.fig .media>video{display:block;height:auto}
.fig figcaption{text-align:center;color:var(--t3);font-size:13px;margin-top:9px}
.sh .k{margin:30px 0 12px}
.sec{font-size:17px;font-weight:500;letter-spacing:-.005em;color:var(--t1);margin:34px 0 12px}
.sh .body p{color:var(--t1);line-height:1.65;max-width:62ch}
.big{padding:18px 20px;margin:4px 0 6px}
.big b{display:block;font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1}
.big span{display:block;color:var(--t3);font-size:13.5px;margin-top:8px}
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 4px}
.seq span{font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:8px;background:var(--lift);box-shadow:var(--sh-card);color:var(--t2)}
.seq span.x{text-decoration:line-through;text-decoration-color:var(--t3);color:var(--t3)}
.seq span.ok{color:var(--acc)}
.seq i{font-style:normal;color:var(--t3);font-size:12px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}
.pill{position:absolute;left:50%;bottom:16px;z-index:3;display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--sh-card),var(--sh-lift);transform:translateX(-50%)}
.pill button{display:grid;place-items:center;height:34px;padding:0 18px;border-radius:999px;background:var(--lift);box-shadow:var(--sh-card);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t1);white-space:nowrap;transition:background .15s var(--ease)}
.pill button.ar{width:34px;padding:0}.pill button[hidden],.links [hidden]{display:none}
.rs{background:#fff}.rs .hot{position:absolute;border-radius:3px;transition:background .15s}.rs .hot:hover,.rs .hot:focus-visible{background:#2563eb26;outline:1px solid #2563eb80}
.pill button:hover{background:var(--lift-h)}

/* hardest bug, inside a project sheet */
.bug{padding:18px 20px 20px}
.bug h5{font-size:17px;font-weight:500;margin:0 0 4px}
.bug>p{color:var(--t3);font-size:14px;margin-bottom:6px}
.bug .body{display:grid;gap:12px;margin-top:14px}
.bug .body p{font-size:14.5px;color:var(--t2)}
.bug .body b{font-weight:500;color:var(--t1)}
.bug .big{background:var(--fg)}

/* other projects */
.po-h{margin:28px 0 12px}
.pos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.po{padding:14px 15px 15px}
.po b{display:block;font-weight:500;font-size:15px}
.po em{display:block;font-style:normal;font-size:12.5px;color:var(--t3);margin-top:1px}
.po p{color:var(--t2);font-size:13.5px;line-height:1.45;margin-top:8px}

/* career journey, drawn to scale; it stretches to fill its panel */
#journey .bd{min-height:calc(100% - 60px);display:flex;flex-direction:column}
.chart{position:relative;flex:1 1 auto;min-height:600px;margin-top:2px;--H:calc(100% - 22px)}

  p.classList.remove("open", "wide"); sh.inert = true; p.querySelector(".wrap").inert = false;
  const o = state[pid] && state[pid].opener; if (o && document.contains(o)) o.focus({ preventScroll: true });
  try { history.replaceState(null, "", "#" + pid); } catch (_) {}
}
panels.forEach(p => {
  const sh = p.querySelector(".sheet"); if (!sh) return;
  const pid = p.id;
  sh.querySelector(".cl").onclick = () => closeSheet(pid);
  sh.querySelector(".pv").onclick = () => openSheet(pid, state[pid].idx - 1);
  sh.querySelector(".nx").onclick = () => openSheet(pid, state[pid].idx + 1);
  // drag the top edge down to close; a tap closes too
  const grab = sh.querySelector(".grab"); let d = null;
  grab.addEventListener("pointerdown", e => { d = { y: e.clientY, t: performance.now(), dy: 0 }; grab.setPointerCapture(e.pointerId); sh.style.transition = "none"; });
  grab.addEventListener("pointermove", e => { if (!d) return; d.dy = Math.max(0, e.clientY - d.y); sh.style.transform = `translateY(${d.dy}px)`; });
  const end = () => {
    if (!d) return; const v = d.dy / Math.max(1, performance.now() - d.t), dy = d.dy; d = null;
    sh.style.transition = ""; sh.style.transform = "";
    if (dy < 4 || dy > 110 || (v > .5 && dy > 24)) closeSheet(pid);
  };
  grab.addEventListener("pointerup", end); grab.addEventListener("pointercancel", end);
});

/* ---------- clicks ---------- */
row.addEventListener("click", e => {
  const t = e.target.closest("[data-proj],[data-exp],[data-edu],[data-go],[data-copy],[data-resume],[data-dl]");
  if (!t) return;
  if (t.dataset.proj !== undefined) openSheet("projects", +t.dataset.proj, t);
  else if (t.dataset.exp !== undefined) openSheet("journey", +t.dataset.exp, t);
  else if (t.dataset.edu !== undefined) openSheet("journey", EXP.length + +t.dataset.edu, t);
  else if (t.dataset.go !== undefined) goTo(PANELS.findIndex(P => P.id === t.dataset.go));
  else if (t.dataset.copy !== undefined) copyEmail(t);
  else if (t.dataset.resume !== undefined) openSheet("contact", 0, t);
  else if (t.dataset.dl !== undefined) saveResume(t);
});
function copyEmail(btn) {
  const label = btn.innerHTML;
  const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.innerHTML = label), 1600); };
  const fallback = () => { goTo(panels.length - 1); const r = document.createRange(); r.selectNodeContents(document.getElementById("mailText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(ME.email).then(done, fallback); } catch (_) { fallback(); }
}
document.getElementById("mailTop").onclick = e => openSheet("contact", 0, e.currentTarget);

/* ---------- things that play while they're on screen ---------- */
// project cards: screenshots advance like a short reel; hovering a thumbnail takes over
row.querySelectorAll(".pj").forEach(card => {
  if (card.querySelector(".viz")) { new IntersectionObserver(([en]) => en.isIntersecting && card.classList.add("seen"), { threshold: .4 }).observe(card); return; }
  const thumbs = [...card.querySelectorAll(".th span")], main = card.querySelector(".media>img");
  if (thumbs.length < 2) return;
  let cur = 0, hold = false;
  const show = j => {
    cur = j; thumbs.forEach((x, k) => x.classList.toggle("on", k === j));
    const src = thumbs[j].dataset.src;
    if (main.getAttribute("src") !== src) { main.style.opacity = 0; setTimeout(() => { main.src = src; main.style.opacity = 1; }, 160); }
  };
  thumbs.forEach((s, j) => s.addEventListener("mouseenter", () => show(j)));
  card.addEventListener("mouseenter", () => card.classList.add("hold"));
  card.addEventListener("mouseleave", () => card.classList.remove("hold"));
  thumbs.forEach(s => s.addEventListener("animationend", () => { if (card.classList.contains("play") && !card.classList.contains("hold")) show((cur + 1) % thumbs.length); }));
  if (!reduce) new IntersectionObserver(([en]) => card.classList.toggle("play", en.isIntersecting), { threshold: .6 }).observe(card);
});

// recordings play only while they're on screen (reduced motion keeps the poster frame)
if (!reduce) { const io = new IntersectionObserver(es => es.forEach(en => en.isIntersecting ? en.target.play().catch(() => {}) : en.target.pause()), { threshold: .35 });
  row.querySelectorAll("video:not([controls])").forEach(v => { v.preload = "auto"; io.observe(v); }); }

// years of writing code for a living, ticking
const ticker = row.querySelector(".ticker");
(function tickYears() { ticker.textContent = ((Date.now() - START) / 31557600000).toFixed(8); setTimeout(tickYears, reduce ? 1000 : 60); })();

/* ---------- theme ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem("mn-theme"); if (t) root.dataset.theme = t; } catch (_) {}
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("mn-theme", root.dataset.theme); } catch (_) {}
};

/* ---------- keys + links ---------- */
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const open = document.querySelector(".p.open");
  if (e.key === "Escape" && open) { closeSheet(open.id); return; }
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const inSheet = open && open.contains(document.activeElement);
  if (inSheet) { const st = state[open.id], n = st.idx + (e.key === "ArrowRight" ? 1 : -1); if (n >= 0 && n < LISTS[open.id].length) openSheet(open.id, n); }
  else document.getElementById(e.key === "ArrowRight" ? "next" : "prev").click();
  e.preventDefault();
});
function route() {
  const h = decodeURIComponent(location.hash.slice(1)); if (!h) return;
  const pi = PANELS.findIndex(P => P.id === h); if (pi >= 0) { goTo(pi, true); return; }
  for (const pid of Object.keys(LISTS)) {
    const k = LISTS[pid].findIndex(x => x.id === h);
    if (k >= 0) { goTo(PANELS.findIndex(P => P.id === pid), true); openSheet(pid, k); return; }
  }
}
addEventListener("hashchange", route);

/* ---------- live clock ---------- */
function tick() {
  let t = ""; try { t = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/Los_Angeles" }); } catch (_) { t = new Date().toLocaleTimeString(); }
  document.querySelectorAll(".clock").forEach(c => (c.textContent = t));
}
tick(); setInterval(tick, 15000);
sync(); route();
</script>
</body></html>
